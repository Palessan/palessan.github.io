<head>
    <script src="wasm_exec.js"></script>
    <script>
        if (WebAssembly){
            const go = new Go();
            WebAssembly
            .instantiateStreaming(fetch("main.wasm"), go.importObject)
            .then((result) => {
                go.run(result.instance);
            });
    }
    </script>
    <title></title>
</head>
